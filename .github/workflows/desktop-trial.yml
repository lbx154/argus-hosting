name: Hosting desktop installers

on:
  workflow_dispatch:
    inputs:
      argus_ref:
        description: Argus source revision (must include the desktop split)
        default: dev
        type: string
      run_live_smoke:
        description: Install and exercise the package using ARGUS_TRIAL_SMOKE_KEY
        default: false
        type: boolean
  push:
    paths: ['desktop/**', 'frontend/workspace/**', 'pyproject.toml', 'argus_hosting/trial/**', 'tests/desktop/**', '.github/workflows/desktop-trial.yml']
  pull_request:
    paths: ['desktop/**', 'frontend/workspace/**', 'pyproject.toml', 'argus_hosting/trial/**', 'tests/desktop/**', '.github/workflows/desktop-trial.yml']

permissions:
  contents: read

jobs:
  desktop:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb xauth dbus-x11 libfuse2
      - name: Fetch and assemble the Argus desktop
        env:
          ARGUS_SOURCE_REF: ${{ inputs.argus_ref || 'dev' }}
        run: python desktop/assemble.py --argus-ref "$ARGUS_SOURCE_REF" --destination argus-src
      - name: Install Argus, the hosting package and build dependencies
        run: |
          python -m pip install -e './argus-src[dev]' -e '.[dev]' 'pyinstaller>=6.11,<7' tzdata
          npm --prefix argus-src/desktop-tauri ci
          npm --prefix argus-src/frontend/web ci
          npm --prefix argus-src/frontend/tui ci
      - name: Check desktop and client sources
        env:
          ARGUS_TEST_NATIVE_COPILOT: '1'
        run: |
          python -m pytest argus-src/tests/desktop tests/desktop tests/trial/test_desktop.py tests/trial/test_client.py --basetemp=desktop/build/pytest-temp
          python -c "import shutil; shutil.rmtree('desktop/build/pytest-temp')"
          npm --prefix argus-src/desktop-tauri run ui:typecheck
          npm --prefix argus-src/desktop-tauri run test:copy
          npm --prefix argus-src/desktop-tauri run test:release
          cargo check --locked --manifest-path argus-src/desktop-tauri/src-tauri/Cargo.toml
          cargo test --locked --manifest-path argus-src/desktop-tauri/src-tauri/Cargo.toml --test core_tests
      - name: Check private Key setup in the browser
        working-directory: argus-src/desktop-tauri
        run: |
          npx playwright install ${{ runner.os == 'macOS' && 'webkit' || 'chromium' }}
          npx playwright test tests/shell.spec.ts tests/trial.spec.ts --workers=2
      - name: Build frozen hosting backend and native package
        env:
          ARGUS_TEST_NATIVE_COPILOT: '1'
        run: python desktop/build.py --source argus-src
      - name: Verify the frozen workspace and private native settings bridge
        working-directory: argus-src/desktop-tauri
        env:
          ARGUS_HOSTING_FROZEN_BACKEND: ${{ github.workspace }}/argus-src/desktop-tauri/build/argus-backend/argus-backend${{ runner.os == 'Windows' && '.exe' || '' }}
        run: npx playwright test tests/hosted-workspace.spec.ts --workers=1
      - name: Install and smoke the native package against the public trial
        if: github.event_name == 'workflow_dispatch' && inputs.run_live_smoke
        env:
          ARGUS_TRIAL_SMOKE_KEY: ${{ secrets.ARGUS_TRIAL_SMOKE_KEY }}
        run: |
          python desktop/run-release-smoke.py --source argus-src
      - uses: actions/upload-artifact@v4
        with:
          name: argus-hosting-desktop-${{ matrix.os }}
          path: |
            argus-src/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            argus-src/desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            argus-src/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            argus-src/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
