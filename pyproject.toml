[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-hosting"
version = "0.1.0"
description = "Release-gate and hosting tooling for Argus, kept outside the Argus core repository."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "lbx154" },
]
dependencies = [
  "argus",
  "cryptography>=41",
  "httpx>=0.27,<1",
  "jsonschema>=4",
  "portalocker>=3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-xdist>=3",
  "ruff>=0.4",
]

[project.scripts]
pr-gate = "argus_hosting.pr_gate.regression.cli:main"
argus-trial-server = "argus_trial_server.admin:main"
argus-compute = "argus_trial_server.compute_client:main"
argus-trial = "argus_hosting.trial.__main__:main"

[project.entry-points."argus.hosting"]
trial = "argus_trial_server.hosting"

[project.entry-points."argus.hosting.client"]
trial = "argus_hosting.trial.hosting"

[project.urls]
Repository = "https://github.com/lbx154/argus-hosting"
Argus = "https://github.com/lbx154/Argus"

[tool.hatch.build.targets.wheel]
packages = ["argus_hosting", "argus_trial_server"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv", "argus-src"]

[tool.ruff.lint]
select = ["F", "E", "I"]
ignore = ["E501", "E402", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["argus_hosting", "argus_trial_server"]
known-third-party = ["argus"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: crosses local process, filesystem or API boundaries",
  "e2e: exercises a complete workflow through a real entry point or toolchain",
]
filterwarnings = ["ignore::DeprecationWarning"]
